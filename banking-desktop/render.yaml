services:
  - type: web
    name: nexabank-web
    env: python
    buildCommand: "pip install -r requirements.txt -r requirements_web.txt"
    startCommand: "uvicorn web.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: nexabank
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
