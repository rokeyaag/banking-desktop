<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaBank | Login & Access Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        },
                        darkBg: '#0b1120',
                        cardBg: 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1120; }
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient Gradient Blobs -->
    <div class="glow-effect bg-cyan-500 top-10 left-10"></div>
    <div class="glow-effect bg-indigo-500 bottom-10 right-10"></div>

    <div class="w-full max-w-md z-10">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 shadow-xl shadow-cyan-500/20 mb-4">
                <i data-lucide="landmark" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                NexaBank
            </h1>
            <p class="text-sm text-slate-400 mt-1.5">Intelligent Digital Banking Platform</p>
        </div>

        <!-- Auth Card -->
        <div class="glass rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            
            <!-- Auth Tabs -->
            <div class="flex p-1 bg-slate-800/80 rounded-xl mb-6 border border-slate-700/50">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md">
                    Sign In
                </button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
                    Create Account
                </button>
            </div>

            <!-- Notification Alert -->
            <div id="alert-box" class="hidden mb-4 p-3.5 rounded-xl text-sm flex items-center gap-3 transition-all"></div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="login-email" required placeholder="admin@nexabank.com" value="admin@nexabank.com"
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-password" required placeholder="Password123" value="Password123"
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-11 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                        <button type="button" onclick="togglePassword('login-password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0">
                        <span>Remember session</span>
                    </label>
                    <span class="text-cyan-400 hover:underline cursor-pointer">Demo PIN: 1234</span>
                </div>

                <button type="submit" id="login-btn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-cyan-500/25 transition-all duration-200 flex items-center justify-center gap-2 mt-4">
                    <span>Sign In to Dashboard</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="reg-name" required placeholder="John Doe"
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="reg-email" required placeholder="john@example.com"
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Phone (Optional)</label>
                    <div class="relative">
                        <i data-lucide="phone" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="reg-phone" placeholder="+1 (555) 000-0000"
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Create Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="reg-password" required minlength="6" placeholder="Minimum 6 characters"
                            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-11 pr-11 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    </div>
                </div>

                <button type="submit" id="reg-btn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-bold rounded-xl shadow-lg shadow-cyan-500/25 transition-all duration-200 flex items-center justify-center gap-2 mt-4">
                    <span>Create Free Account</span>
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Demo Credentials Quick Fill -->
            <div class="mt-6 pt-5 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                <span>Preloaded Demo Account</span>
                <button onclick="autofillDemo()" class="text-cyan-400 hover:text-cyan-300 font-semibold flex items-center gap-1">
                    <i data-lucide="zap" class="w-3.5 h-3.5"></i> Autofill Admin
                </button>
            </div>
        </div>

        <div class="text-center mt-6 text-xs text-slate-500">
            &copy; 2026 NexaBank Technologies. Protected by 256-bit encryption.
        </div>
    </div>

    <script>
        lucide.createIcons();

        function switchTab(mode) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            hideAlert();

            if (mode === 'login') {
                loginTab.className = 'flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md';
                regTab.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all';
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regTab.className = 'flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md';
                loginTab.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all';
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
            lucide.createIcons();
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showAlert(msg, isError = true) {
            const box = document.getElementById('alert-box');
            box.className = isError 
                ? 'mb-4 p-3.5 rounded-xl text-sm flex items-center gap-3 bg-rose-500/10 border border-rose-500/30 text-rose-300'
                : 'mb-4 p-3.5 rounded-xl text-sm flex items-center gap-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300';
            const icon = isError ? 'alert-circle' : 'check-circle-2';
            box.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i><span>${msg}</span>`;
            box.classList.remove('hidden');
            lucide.createIcons();
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        function autofillDemo() {
            switchTab('login');
            document.getElementById('login-email').value = 'admin@nexabank.com';
            document.getElementById('login-password').value = 'Password123';
            showAlert('Admin credentials filled. Click "Sign In to Dashboard"!', false);
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> Verifying...';

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Login failed');

                localStorage.setItem('nexabank_token', data.token);
                localStorage.setItem('nexabank_user', JSON.stringify(data.user));
                showAlert('Login successful! Redirecting...', false);
                setTimeout(() => window.location.href = '/', 600);
            } catch (err) {
                showAlert(err.message, true);
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In to Dashboard</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideAlert();
            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> Creating Account...';

            const full_name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, phone, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Registration failed');

                localStorage.setItem('nexabank_token', data.token);
                localStorage.setItem('nexabank_user', JSON.stringify(data.user));
                showAlert('Registration successful! Redirecting...', false);
                setTimeout(() => window.location.href = '/', 600);
            } catch (err) {
                showAlert(err.message, true);
                btn.disabled = false;
                btn.innerHTML = '<span>Create Free Account</span><i data-lucide="check-circle-2" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
